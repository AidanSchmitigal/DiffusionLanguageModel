# --- model ---
spec: "smollm2-135m"

# --- data ---
dataset: "HuggingFaceFW/fineweb-edu"
dataset_config: "sample-10BT"
seq_len: 256
max_docs: 120_000
batch_size: 16

# --- optimisation ---
steps: 160_000
lr: 2.0e-4
warmup_steps: 800
weight_decay: 0.01
grad_clip: 1.0

# --- attention annealing ---
anneal_steps: 8_000

# --- runtime ---
log_steps: 25
save_steps: 500
sample_steps: 1_000
out_dir: "runs/smollm2-135m"
seed: 42
