# --- model ---
spec: smollm3-3b

# --- data ---
dataset: HuggingFaceFW/fineweb-edu
dataset_config: sample-10BT
seq_len: 256
max_docs: 8000
batch_size: 8

# --- optimisation ---
steps: 1500
lr: 4.0e-5
warmup_steps: 60
weight_decay: 0.01
grad_clip: 1.0

# --- attention annealing ---
anneal_steps: 225 # 15% of steps

# --- runtime ---
log_steps: 25
save_steps: 300
out_dir: "runs/smollm3-3b"
seed: 0
